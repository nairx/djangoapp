{% extends 'base.html' %}
{% block content %}

<h1>Home Page</h1>


<div style="display:flex">

{% for product in products %}



<div style="border:1px solid gray">
    <img src={{product.imageUrl}} width="300px" alt="">
    <h3> {{product.name}}</h3>
    <p>{{product.desc}}</p>
    <h4>{{product.price}}</h4>
    <p>
        <button>Add to Cart</button>
    </p>

</div>



{% endfor %}

</div>


{% endblock %}
